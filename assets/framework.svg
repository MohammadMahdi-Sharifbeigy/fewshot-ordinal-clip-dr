<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 730" width="1280" height="730" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34495E"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D35400"/>
    </marker>
    <radialGradient id="fundus" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8743B"/>
      <stop offset="70%" stop-color="#C0392B"/>
      <stop offset="100%" stop-color="#7B1E14"/>
    </radialGradient>
    <linearGradient id="heat" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#EDE7F6"/>
      <stop offset="100%" stop-color="#5E35B1"/>
    </linearGradient>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1280" height="730" rx="14" fill="#FFFFFF"/>

  <!-- title + legend -->
  <text x="20" y="34" font-size="19" font-weight="bold" fill="#1B2631">Few-Shot Ordinal-Aware CLIP for Diabetic Retinopathy Grading — Framework Overview</text>
  <rect x="902" y="20" width="16" height="16" rx="3" fill="#E8EEF7" stroke="#5B7DB1"/>
  <text x="924" y="33" font-size="12" fill="#2C3E50">frozen</text>
  <rect x="982" y="20" width="16" height="16" rx="3" fill="#FDEBD8" stroke="#E67E22"/>
  <text x="1004" y="33" font-size="12" fill="#2C3E50">trainable</text>
  <rect x="1074" y="20" width="16" height="16" rx="3" fill="#E6F5EC" stroke="#27AE60"/>
  <text x="1096" y="33" font-size="12" fill="#2C3E50">statistics (no grad)</text>

  <!-- ===================== (a) DATA ===================== -->
  <rect x="20" y="56" width="250" height="560" rx="12" fill="#FAFBFC" stroke="#AEB6BF" stroke-dasharray="6 4"/>
  <text x="34" y="80" font-size="14" font-weight="bold" fill="#1B2631">(a) Data &amp; few-shot protocol</text>

  <rect x="40" y="96" width="210" height="54" rx="8" fill="#FFFFFF" stroke="#7F8C8D"/>
  <text x="145" y="118" font-size="13" font-weight="bold" text-anchor="middle" fill="#2C3E50">Raw fundus datasets</text>
  <text x="145" y="137" font-size="11.5" text-anchor="middle" fill="#566573">DeepDRiD · APTOS (CFP)</text>
  <line x1="145" y1="150" x2="145" y2="172" stroke="#34495E" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="40" y="174" width="210" height="54" rx="8" fill="#FFFFFF" stroke="#7F8C8D"/>
  <text x="145" y="196" font-size="13" font-weight="bold" text-anchor="middle" fill="#2C3E50">Manifest builder</text>
  <text x="145" y="215" font-size="11.5" text-anchor="middle" fill="#566573">path · grade (0–4) · split</text>
  <line x1="145" y1="228" x2="145" y2="250" stroke="#34495E" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="40" y="252" width="210" height="72" rx="8" fill="#FFFFFF" stroke="#7F8C8D"/>
  <text x="145" y="274" font-size="13" font-weight="bold" text-anchor="middle" fill="#2C3E50">Stratified k-shot sampler</text>
  <text x="145" y="293" font-size="11.5" text-anchor="middle" fill="#566573">k images per grade</text>
  <text x="145" y="311" font-size="11.5" text-anchor="middle" fill="#566573">k ∈ {1, 2, 4, 8, 16, 32} · seeds 1–3</text>
  <line x1="145" y1="324" x2="145" y2="346" stroke="#34495E" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="40" y="348" width="66" height="58" rx="7" fill="#FDEBD8" stroke="#E67E22"/>
  <text x="73" y="372" font-size="12" font-weight="bold" text-anchor="middle" fill="#2C3E50">Support</text>
  <text x="73" y="391" font-size="10.5" text-anchor="middle" fill="#566573">k × 5 · train</text>
  <rect x="112" y="348" width="66" height="58" rx="7" fill="#FFFFFF" stroke="#7F8C8D"/>
  <text x="145" y="372" font-size="12" font-weight="bold" text-anchor="middle" fill="#2C3E50">Query</text>
  <text x="145" y="391" font-size="10.5" text-anchor="middle" fill="#566573">val · early stop</text>
  <rect x="184" y="348" width="66" height="58" rx="7" fill="#FFFFFF" stroke="#7F8C8D"/>
  <text x="217" y="372" font-size="12" font-weight="bold" text-anchor="middle" fill="#2C3E50">Test</text>
  <text x="217" y="391" font-size="10.5" text-anchor="middle" fill="#566573">held-out</text>

  <rect x="40" y="428" width="210" height="170" rx="8" fill="#F4F6F7" stroke="#D5D8DC"/>
  <text x="145" y="450" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#2C3E50">Training regimes</text>
  <text x="56" y="474" font-size="11.5" fill="#2C3E50"><tspan font-weight="bold">Zero-shot</tspan>  k = 0, no updates</text>
  <text x="56" y="496" font-size="11.5" fill="#2C3E50"><tspan font-weight="bold">Few-shot</tspan>  k = 1 … 32</text>
  <text x="56" y="518" font-size="11.5" fill="#2C3E50"><tspan font-weight="bold">Full</tspan>  k = −1, all train data</text>
  <text x="56" y="546" font-size="11" fill="#566573">CLIP preprocessing:</text>
  <text x="56" y="563" font-size="11" fill="#566573">resize 256 → crop 224,</text>
  <text x="56" y="580" font-size="11" fill="#566573">h-flip, colour jitter</text>

  <!-- connector a -> b -->
  <path d="M250,377 H280 V160 H306" fill="none" stroke="#34495E" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ===================== (b) MODEL ===================== -->
  <rect x="290" y="56" width="640" height="560" rx="12" fill="#FAFBFC" stroke="#AEB6BF" stroke-dasharray="6 4"/>
  <text x="304" y="80" font-size="14" font-weight="bold" fill="#1B2631">(b) Ordinal-aware CLIP model</text>

  <!-- image branch -->
  <circle cx="346" cy="160" r="36" fill="url(#fundus)"/>
  <circle cx="362" cy="152" r="8" fill="#F9E79F" opacity="0.9"/>
  <path d="M362,152 C345,140 330,145 320,138 M362,152 C348,168 332,170 322,182 M362,152 C372,134 368,128 360,124" stroke="#7B1E14" stroke-width="1.4" fill="none"/>
  <text x="346" y="214" font-size="11.5" text-anchor="middle" fill="#2C3E50">fundus image x</text>

  <line x1="384" y1="160" x2="414" y2="160" stroke="#34495E" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="416" y="106" width="206" height="108" rx="9" fill="#E8EEF7" stroke="#5B7DB1" stroke-width="1.4"/>
  <text x="519" y="130" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1F3A68">CLIP Image Encoder</text>
  <text x="519" y="149" font-size="11.5" text-anchor="middle" fill="#34495E">ResNet-50 · frozen ❄</text>
  <rect x="432" y="162" width="174" height="38" rx="6" fill="#FDEBD8" stroke="#E67E22" stroke-width="1.3"/>
  <text x="519" y="178" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#A04000">LoRA adapters  (r = 16)</text>
  <text x="519" y="193" font-size="10.5" text-anchor="middle" fill="#A04000">on conv1 / conv2 / conv3</text>

  <line x1="622" y1="160" x2="648" y2="160" stroke="#34495E" stroke-width="1.6" marker-end="url(#arr)"/>
  <g fill="#8E7CC3" stroke="#FFFFFF" stroke-width="1">
    <rect x="650" y="118" width="18" height="14"/><rect x="650" y="132" width="18" height="14"/>
    <rect x="650" y="146" width="18" height="14"/><rect x="650" y="160" width="18" height="14"/>
    <rect x="650" y="174" width="18" height="14"/><rect x="650" y="188" width="18" height="14"/>
  </g>
  <text x="659" y="222" font-size="11.5" text-anchor="middle" fill="#2C3E50">f ∈ ℝ¹⁰²⁴</text>
  <text x="659" y="237" font-size="10.5" text-anchor="middle" fill="#566573">L2-normalised</text>

  <!-- similarity matrix -->
  <line x1="670" y1="160" x2="784" y2="160" stroke="#34495E" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="786" y="100" width="128" height="160" rx="9" fill="#FFFFFF" stroke="#5E35B1" stroke-width="1.4"/>
  <text x="850" y="121" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#4527A0">Similarity S</text>
  <g stroke="#FFFFFF" stroke-width="1.2">
    <rect x="806" y="132" width="18" height="18" fill="#5E35B1"/><rect x="824" y="132" width="18" height="18" fill="#9575CD"/><rect x="842" y="132" width="18" height="18" fill="#D1C4E9"/><rect x="860" y="132" width="18" height="18" fill="#EDE7F6"/><rect x="878" y="132" width="18" height="18" fill="#F6F2FB"/>
    <rect x="806" y="150" width="18" height="18" fill="#B39DDB"/><rect x="824" y="150" width="18" height="18" fill="#5E35B1"/><rect x="842" y="150" width="18" height="18" fill="#9575CD"/><rect x="860" y="150" width="18" height="18" fill="#D1C4E9"/><rect x="878" y="150" width="18" height="18" fill="#EDE7F6"/>
    <rect x="806" y="168" width="18" height="18" fill="#EDE7F6"/><rect x="824" y="168" width="18" height="18" fill="#B39DDB"/><rect x="842" y="168" width="18" height="18" fill="#5E35B1"/><rect x="860" y="168" width="18" height="18" fill="#9575CD"/><rect x="878" y="168" width="18" height="18" fill="#D1C4E9"/>
    <rect x="806" y="186" width="18" height="18" fill="#F6F2FB"/><rect x="824" y="186" width="18" height="18" fill="#EDE7F6"/><rect x="842" y="186" width="18" height="18" fill="#B39DDB"/><rect x="860" y="186" width="18" height="18" fill="#5E35B1"/><rect x="878" y="186" width="18" height="18" fill="#9575CD"/>
  </g>
  <text x="850" y="226" font-size="11.5" text-anchor="middle" fill="#2C3E50">S = s · f tᵀ</text>
  <text x="850" y="243" font-size="10.5" text-anchor="middle" fill="#566573">B × 5 (grades)</text>

  <!-- text branch: RankFormer -->
  <rect x="306" y="290" width="330" height="200" rx="10" fill="#FDEBD8" stroke="#E67E22" stroke-width="1.4"/>
  <text x="471" y="313" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#A04000">RankFormer Prompt Learner 🔥</text>

  <text x="322" y="338" font-size="11" fill="#6E2C00">rank tokens</text>
  <g font-size="11" text-anchor="middle" fill="#FFFFFF" font-weight="bold">
    <rect x="322" y="346" width="26" height="26" rx="4" fill="#E67E22"/><text x="335" y="364">r₁</text>
    <rect x="352" y="346" width="26" height="26" rx="4" fill="#E67E22"/><text x="365" y="364">r₂</text>
    <rect x="382" y="346" width="26" height="26" rx="4" fill="#E67E22"/><text x="395" y="364">r₃</text>
    <rect x="412" y="346" width="26" height="26" rx="4" fill="#E67E22"/><text x="425" y="364">r₄</text>
    <rect x="442" y="346" width="26" height="26" rx="4" fill="#E67E22"/><text x="455" y="364">r₅</text>
  </g>
  <line x1="470" y1="359" x2="490" y2="359" stroke="#A04000" stroke-width="1.5" marker-end="url(#arrO)"/>
  <rect x="492" y="334" width="130" height="50" rx="6" fill="#FFFFFF" stroke="#E67E22"/>
  <text x="557" y="353" font-size="11" font-weight="bold" text-anchor="middle" fill="#A04000">Multi-head self-attn</text>
  <text x="557" y="370" font-size="10.5" text-anchor="middle" fill="#6E2C00">across ranks (4 heads)</text>
  <text x="471" y="401" font-size="11" text-anchor="middle" fill="#6E2C00" font-style="italic">r̂ₖ = rₖ + Attn(r)ₖ   — ranks exchange ordinal context</text>

  <g font-size="10" text-anchor="middle" font-weight="bold">
    <rect x="318" y="416" width="40" height="26" rx="4" fill="#D5D8DC"/><text x="338" y="433" fill="#2C3E50">SOS</text>
    <rect x="362" y="416" width="28" height="26" rx="4" fill="#F5B041"/><text x="376" y="433" fill="#6E2C00">v₁</text>
    <rect x="394" y="416" width="28" height="26" rx="4" fill="#F5B041"/><text x="408" y="433" fill="#6E2C00">v₂</text>
    <text x="440" y="433" fill="#6E2C00">⋯</text>
    <rect x="458" y="416" width="34" height="26" rx="4" fill="#F5B041"/><text x="475" y="433" fill="#6E2C00">v₁₆</text>
    <rect x="496" y="416" width="34" height="26" rx="4" fill="#E67E22"/><text x="513" y="433" fill="#FFFFFF">r̂ₖ</text>
    <rect x="534" y="416" width="40" height="26" rx="4" fill="#D5D8DC"/><text x="554" y="433" fill="#2C3E50">EOS</text>
  </g>
  <text x="471" y="468" font-size="10.5" text-anchor="middle" fill="#6E2C00">16 shared context tokens + one rank token, k = 1 … 5</text>
  <path d="M557,384 V396" stroke="none"/>

  <line x1="636" y1="390" x2="664" y2="390" stroke="#34495E" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="666" y="340" width="104" height="100" rx="9" fill="#E8EEF7" stroke="#5B7DB1" stroke-width="1.4"/>
  <text x="718" y="374" font-size="13" font-weight="bold" text-anchor="middle" fill="#1F3A68">CLIP Text</text>
  <text x="718" y="392" font-size="13" font-weight="bold" text-anchor="middle" fill="#1F3A68">Encoder</text>
  <text x="718" y="414" font-size="11.5" text-anchor="middle" fill="#34495E">frozen ❄</text>

  <line x1="770" y1="390" x2="794" y2="390" stroke="#34495E" stroke-width="1.6" marker-end="url(#arr)"/>
  <g stroke="#FFFFFF" stroke-width="1">
    <rect x="798" y="350" width="18" height="80" rx="3" fill="#F5CBA7"/>
    <rect x="820" y="350" width="18" height="80" rx="3" fill="#F0B27A"/>
    <rect x="842" y="350" width="18" height="80" rx="3" fill="#EB984E"/>
    <rect x="864" y="350" width="18" height="80" rx="3" fill="#DC7633"/>
    <rect x="886" y="350" width="18" height="80" rx="3" fill="#BA4A00"/>
  </g>
  <text x="851" y="450" font-size="11.5" text-anchor="middle" fill="#2C3E50">t₁ … t₅ ∈ ℝ¹⁰²⁴</text>
  <text x="851" y="465" font-size="10.5" text-anchor="middle" fill="#566573">rank prototypes</text>
  <line x1="851" y1="348" x2="851" y2="262" stroke="#34495E" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ordinal intuition strip -->
  <rect x="306" y="512" width="608" height="88" rx="9" fill="#FFFFFF" stroke="#D5D8DC"/>
  <text x="322" y="534" font-size="12" font-weight="bold" fill="#2C3E50">Ordinal grade axis</text>
  <line x1="340" y1="566" x2="890" y2="566" stroke="#5D6D7E" stroke-width="2" marker-end="url(#arr)"/>
  <g font-size="11" text-anchor="middle" fill="#2C3E50">
    <circle cx="380" cy="566" r="7" fill="#27AE60"/><text x="380" y="589">0 · No DR</text>
    <circle cx="495" cy="566" r="7" fill="#A9CC52"/><text x="495" y="589">1 · Mild</text>
    <circle cx="610" cy="566" r="7" fill="#F4D03F"/><text x="610" y="589">2 · Moderate</text>
    <circle cx="725" cy="566" r="7" fill="#E67E22"/><text x="725" y="589">3 · Severe</text>
    <circle cx="840" cy="566" r="7" fill="#C0392B"/><text x="840" y="589">4 · PDR</text>
  </g>
  <text x="900" y="534" font-size="11" text-anchor="end" fill="#566573" font-style="italic">prototypes should respect this order</text>

  <!-- ===================== (c) OBJECTIVE / OUTPUT ===================== -->
  <rect x="950" y="56" width="310" height="560" rx="12" fill="#FAFBFC" stroke="#AEB6BF" stroke-dasharray="6 4"/>
  <text x="964" y="80" font-size="14" font-weight="bold" fill="#1B2631">(c) Objective, calibration &amp; output</text>

  <line x1="914" y1="170" x2="964" y2="170" stroke="#34495E" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="966" y="96" width="280" height="196" rx="9" fill="#FFFFFF" stroke="#2C3E50" stroke-width="1.3"/>
  <text x="1106" y="117" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#2C3E50">Training objective (support set)</text>
  <rect x="980" y="126" width="252" height="30" rx="6" fill="#F4F6F7"/>
  <text x="1106" y="146" font-size="14" text-anchor="middle" fill="#1B2631" font-style="italic">ℒ = ℒ<tspan font-size="10" dy="3">CE</tspan><tspan dy="-3"> + λ·ℒ</tspan><tspan font-size="10" dy="3">rank</tspan><tspan dy="-3"> + μ·ℒ</tspan><tspan font-size="10" dy="3">pair</tspan></text>
  <text x="980" y="178" font-size="11.5" font-weight="bold" fill="#2C3E50">ℒ<tspan font-size="9" dy="3">CE</tspan></text>
  <text x="1022" y="178" font-size="11" fill="#34495E">cross-entropy over the 5 grades</text>
  <text x="980" y="206" font-size="11.5" font-weight="bold" fill="#2C3E50">ℒ<tspan font-size="9" dy="3">rank</tspan></text>
  <text x="1022" y="206" font-size="11" fill="#34495E">ranking-aware loss: similarity</text>
  <text x="1022" y="221" font-size="11" fill="#34495E">decreases monotonically away from y</text>
  <text x="1022" y="236" font-size="10" fill="#7F8C8D" font-style="italic">after CLIP-DR (MICCAI 2024)</text>
  <text x="980" y="260" font-size="11.5" font-weight="bold" fill="#2C3E50">ℒ<tspan font-size="9" dy="3">pair</tspan></text>
  <text x="1022" y="260" font-size="11" fill="#34495E">pairwise CE weighted by |y − j|</text>
  <text x="1022" y="275" font-size="10" fill="#7F8C8D" font-style="italic">after L2RCLIP (NeurIPS 2023)</text>

  <path d="M914,230 C935,230 935,380 964,380" fill="none" stroke="#34495E" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="966" y="310" width="280" height="150" rx="9" fill="#E6F5EC" stroke="#27AE60" stroke-width="1.4"/>
  <text x="1106" y="332" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1E8449">Similarity Matrix Smoothing (SMS)</text>
  <text x="980" y="358" font-size="11" fill="#145A32"><tspan font-weight="bold">train</tspan>  per-rank mean similarity μⱼ</text>
  <text x="980" y="380" font-size="11" fill="#145A32"><tspan font-weight="bold">epoch end</tspan>  Gaussian kernel over ranks</text>
  <text x="1106" y="402" font-size="12" text-anchor="middle" fill="#145A32" font-style="italic">μ̃ = K μ</text>
  <text x="980" y="426" font-size="11" fill="#145A32"><tspan font-weight="bold">inference</tspan>  column-wise mean shift</text>
  <text x="1106" y="448" font-size="12" text-anchor="middle" fill="#145A32" font-style="italic">S̃ = S − μ + μ̃</text>

  <line x1="1106" y1="460" x2="1106" y2="480" stroke="#34495E" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="966" y="482" width="280" height="118" rx="9" fill="#FFFFFF" stroke="#5E35B1" stroke-width="1.4"/>
  <text x="1106" y="504" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#4527A0">Prediction &amp; evaluation</text>
  <text x="1106" y="526" font-size="12" text-anchor="middle" fill="#2C3E50" font-style="italic">ŷ = argmax softmax(S̃)</text>
  <g font-size="10.5" text-anchor="middle" font-weight="bold" fill="#4527A0">
    <rect x="980" y="540" width="76" height="22" rx="11" fill="#EDE7F6"/><text x="1018" y="555">QWK ↑</text>
    <rect x="1068" y="540" width="76" height="22" rx="11" fill="#EDE7F6"/><text x="1106" y="555">MAE ↓</text>
    <rect x="1156" y="540" width="76" height="22" rx="11" fill="#EDE7F6"/><text x="1194" y="555">Macro-F1 ↑</text>
    <rect x="980" y="568" width="76" height="22" rx="11" fill="#EDE7F6"/><text x="1018" y="583">AUC ↑</text>
    <rect x="1068" y="568" width="76" height="22" rx="11" fill="#EDE7F6"/><text x="1106" y="583">Acc ↑</text>
    <rect x="1156" y="568" width="76" height="22" rx="11" fill="#EDE7F6"/><text x="1194" y="583">LOS ↑</text>
  </g>

  <!-- ===================== (d) PROTOCOL ===================== -->
  <rect x="20" y="632" width="1240" height="80" rx="12" fill="#F4F6F7" stroke="#AEB6BF" stroke-dasharray="6 4"/>
  <text x="34" y="656" font-size="14" font-weight="bold" fill="#1B2631">(d) Experimental protocol</text>
  <g font-size="11.5" fill="#2C3E50">
    <rect x="34" y="668" width="258" height="30" rx="15" fill="#FFFFFF" stroke="#D5D8DC"/>
    <text x="163" y="688" text-anchor="middle">8 regimes: ZS · 1 · 2 · 4 · 8 · 16 · 32 · Full</text>
    <rect x="304" y="668" width="200" height="30" rx="15" fill="#FFFFFF" stroke="#D5D8DC"/>
    <text x="404" y="688" text-anchor="middle">3 seeds → mean ± std</text>
    <rect x="516" y="668" width="250" height="30" rx="15" fill="#FFFFFF" stroke="#D5D8DC"/>
