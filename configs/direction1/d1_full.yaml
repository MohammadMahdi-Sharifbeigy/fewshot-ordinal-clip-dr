# Direction 1 (main method): direct ordinal-geometry grade embeddings,
# CE + CLIP-DR ranking + SMS + ladder / path / anchor geometry
defaults:
  - ../deepdrid_cfp
model:
  prompt_learner:
    name: "ordinal_geometry_embeddings"
    init_mode: "icdr_clinical"        # icdr_clinical | plain | random_ortho
    anchor_weighting: "uniform"       # uniform | inverse_sqrt_freq | clap
    path_mode: "both"                 # smooth | align | both
    ladder_margin: 0.05
    renorm_after_step: true
  sms:
    enabled: true
loss:
  w_ce: 1.0
  w_clipdr: 1.0
  w_pairwise: 0.0     # distance-weighted pairwise loss (L2RCLIP-inspired): see *_plus_pairwise.yaml
  w_sms: 1
  w_ladder: 1.0
  w_path: 1.0
  w_anchor: 1.0