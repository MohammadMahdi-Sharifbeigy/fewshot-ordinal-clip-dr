# Direction 3 (main method): grades as von Mises-Fisher distributions in CLIP's
# joint space. Means start from the zero-shot ICDR description ensemble, one
# learned concentration per grade, vMF-mixture posterior as the classifier.
# CE + CLIP-DR ranking on the vMF logits, ladder and anchor
# on the means, log-normal prior on the concentrations. No SMS: broad grades
# already spread probability onto their neighbours.
defaults:
  - ../deepdrid_cfp
model:
  prompt_learner:
    name: "vmf_grade_distributions"
    prompt_set: "icdr_ensemble"
    vmf:
      kappa_init: 100.0          # CLIP's logit scale: zero-shot = CLIP's softmax
      kappa_mode: "per_grade"    # per_grade | shared | fixed
      scoring: "likelihood"      # likelihood | expected
    anchor_weighting: "uniform"
    ladder_margin: 0.05
    renorm_after_step: true
  sms:
    enabled: false
loss:
  w_ce: 1.0
  w_clipdr: 1.0
  w_pairwise: 0.0     # distance-weighted pairwise loss (L2RCLIP-inspired): see *_plus_pairwise.yaml
  w_sms: 0
  w_ladder: 1.0
  w_anchor: 1.0
  w_path: 0.0
  w_kappa: 0.1
train:
  kappa_lr: 1.0e-2               # log-concentrations need a larger step than the means
