# L2RCLIP (Wang et al., NeurIPS 2023), our implementation from the paper: the
# official repository has no model, training code or weights. Its two parts on
# their own: RankFormer over the rank tokens (LN -> MSA -> FFN, alpha blend) and
# our distance-weighted pairwise loss inspired by its cross-modal ordinal pairwise
# loss, with CE, on the matched setup (RN50 + LoRA). None of our own parts (SMS,
# CLIP-DR ranking loss).
defaults:
  - ../default
model:
  image_encoder:
    lora:
      enabled: true
  prompt_learner:
    name: "rankformer_prompt_learner"
  sms:
    enabled: false
loss:
  lambda_rank: 0.0
  mu_pairwise: 1.0
data:
  manifest: "data/DeepDRiD/CFP_manifest.csv"
  splits_dir: "data/DeepDRiD/splits"
