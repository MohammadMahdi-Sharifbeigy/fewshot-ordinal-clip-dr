# CLIP-DR (Yu et al., MICCAI 2024), matched; checked against github.com/Qinkaiyu/CLIP-DR.
# Its prompt learner (PlainPromptLearner: 10 random context tokens, one free token
# per grade, sentence "<ctx> <rank>.") and its loss (CE + KL + ranking-aware loss),
# on our matched setup (RN50 + LoRA, our optimiser, preprocessing and budget).
# SMS is off, as in CLIP-DR's released training code (the calls are commented out);
# the paper reports it. Set model.sms.enabled=true for the paper's version.
defaults:
  - ../default
model:
  image_encoder:
    lora:
      enabled: true
  prompt_learner:
    name: "ordinalclip_rank_prompt_learner"
    num_tokens_for_context: 10
    num_base: 5
    interpolation: "none"
    init_context: null
    full_stop: true
  sms:
    enabled: false
loss:
  lambda_rank: 1.0
  mu_pairwise: 0.0
  w_kl: 1.0
data:
  manifest: "data/DeepDRiD/CFP_manifest.csv"
  splits_dir: "data/DeepDRiD/splits"
