# CLIP-DR (Yu et al., MICCAI 2024), official recipe (default.yaml of github.com/Qinkaiyu/CLIP-DR):
# full image-encoder fine-tuning, RAdam lr 1e-4 without weight decay, 31 epochs at a
# constant rate (its step at epoch 60 is never reached), batch 64, its preprocessing.
# Its prompt learner (PlainPromptLearner: 10 random context tokens, one free token
# per grade, sentence "<ctx> <rank>.") and its loss (CE + KL + ranking-aware loss).
# SMS is off, as in CLIP-DR's released training code (the calls are commented out);
# the paper reports it. Set model.sms.enabled=true for the paper's version.
defaults:
  - ../default
model:
  image_encoder:
    lora:
      enabled: false
    full_finetune: true
  prompt_learner:
    name: "ordinalclip_rank_prompt_learner"
    num_tokens_for_context: 10
    num_base: 5
    interpolation: "none"
    init_context: null
    full_stop: true
  sms:
    enabled: false
loss:
  lambda_rank: 1.0
  mu_pairwise: 0.0
  w_kl: 1.0
data:
  manifest: "data/DeepDRiD/CFP_manifest.csv"
  splits_dir: "data/DeepDRiD/splits"
  augment: "ordinalclip"
  batch_query: 64
train:
  optimizer: "radam"
  lr: 1e-4
  weight_decay: 0.0
  scheduler: "none"
  warmup_epochs: 0
  epochs: 31
