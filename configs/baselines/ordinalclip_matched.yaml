# OrdinalCLIP (Li et al., NeurIPS 2022), matched to our setup: OrdinalCLIP's
# prompt learner (text-initialised context, 3 interpolated base ranks,
# "<ctx> <rank>." sentence) and CE + KL loss, trained with our optimiser,
# schedule and preprocessing on a frozen image encoder.
defaults:
  - ../default
model:
  image_encoder:
    lora:
      enabled: false
  prompt_learner:
    name: "ordinalclip_rank_prompt_learner"
    num_base: 3
    interpolation: "linear"
    init_context: "diabetic retinopathy grading: the severity of the retinopathy is"
    full_stop: true
  sms:
    enabled: false
loss:
  lambda_rank: 0.0
  mu_pairwise: 0.0
  w_kl: 1.0
data:
  manifest: "data/DeepDRiD/CFP_manifest.csv"
  splits_dir: "data/DeepDRiD/splits"
