runner: src.models.runner.FewShotOrdinalRunner
model:
  image_encoder:
    name: "RN50"
    lora:
      enabled: true
      r: 16
    # Train every image-encoder weight instead of LoRA (OrdinalCLIP / CLIP-DR recipe)
    full_finetune: false
  text_encoder:
    name: "RN50"  # tied to clip_model, not loaded separately
  prompt_learner:
    # Our model uses OrdinalCLIP-style interpolated rank tokens. RankFormer (from
    # L2RCLIP, whose code is not public) is only used in the L2RCLIP configs:
    # configs/baselines/l2rclip_ours_impl.yaml and configs/ours_plus_l2rclip.yaml
    name: "ordinalclip_rank_prompt_learner"
    num_ranks: 5
    num_tokens_for_context: 16
    attn_heads: 4
    # Rank tokens: "interpolated" (OrdinalCLIP bases, shared with the
    # ordinalclip_rank_prompt_learner ablation) or "free" (one token per rank)
    rank_param: "interpolated"
    num_base: 3
    # RankFormer block: "paper" (L2RCLIP: LN -> MSA -> FFN, alpha blend) or "simple" (R + MSA(R))
    rankformer_block: "paper"
    rankformer_alpha: 0.5
    # OrdinalCLIP options shared by both prompt learners
    init_context: null        # sentence to initialise the context tokens (sets their number)
    full_stop: false          # sentence "<ctx> <rank>." as in OrdinalCLIP
    interpolation: "linear"   # OrdinalCLIP base-rank interpolation: linear | inv_prop | normal | none (= CLIP-DR, num_base = num_ranks)
  # OrdinalCLIP and CLIP-DR keep CLIP's logit scale fixed (lr 0)
  freeze_logit_scale: true
  sms:
    enabled: true
    # CLIP-DR / FDS settings (official code values)
    kernel_size: 5
    sigma: 2.0
    momentum: 0.9
data:
  modality: "CFP"
  k_shot: 4
  seed: 1
  # batch_query is used for val/test. For training (support set),
  # the effective batch size is min(k_shot * num_ranks, batch_query).
  batch_query: 32
  image_size: 224
  manifest: "data/MMRDR/CFP_manifest.csv"
  splits_dir: "data/MMRDR/splits"
  num_workers: 0
  # Full-data runs (k_shot = -1): stratified fraction of the train split held
  # out for validation / checkpoint selection (the test split is never used)
  full_val_fraction: 0.2
  # "clip" (ours) or "ordinalclip" (OrdinalCLIP / CLIP-DR preprocessing)
  augment: "clip"
loss:
  lambda_rank: 1.0
  # L2RCLIP-inspired distance-weighted pairwise loss: off in our model, on in the
  # L2RCLIP configs (see prompt_learner.name above)
  mu_pairwise: 0.0
  w_kl: 0.0          # OrdinalCLIP's text-to-image KL loss
  tau: 1.0
train:
  # 100 epochs is appropriate for few-shot: with ~5–160 support images,
  # each epoch is fast (~1–5 gradient steps), so 100 epochs ≈ 100–500 total steps.
  epochs: 100
  optimizer: "adamw"
  lr: 1e-4
  weight_decay: 1e-4
  # Cosine annealing with short linear warmup for stable few-shot training
  scheduler: "cosine"
  warmup_epochs: 5
  early_stopping_patience: 20
  early_stopping_monitor: "val_qwk"
  early_stopping_mode: "max"
metrics: ["qwk", "mae", "macro_f1", "auc", "acc", "los"]
