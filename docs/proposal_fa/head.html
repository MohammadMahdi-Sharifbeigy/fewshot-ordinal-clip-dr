<title>درجه‌بندی ترتیبی رتینوپاتی</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column with a numbered table of contents; formulas and diagrams in LTR blocks */
:root {
  --paper: #fbfaf8;
  --ink: #1d1f22;
  --muted: #5b6168;
  --rule: #e2ded8;
  --accent: #8c3a22;
  --accent-soft: #f4e8e2;
  --panel: #f3f1ee;
  --code: #3c4a57;
  --font-body: "Vazirmatn", "Segoe UI", Tahoma, sans-serif;
  --font-mono: "JetBrains Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #17191c; --ink: #e8e6e3; --muted: #a3a9b0; --rule: #33373c;
    --accent: #e0896b; --accent-soft: #33241f; --panel: #202327; --code: #b9c7d4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #17191c; --ink: #e8e6e3; --muted: #a3a9b0; --rule: #33373c;
  --accent: #e0896b; --accent-soft: #33241f; --panel: #202327; --code: #b9c7d4;
  color-scheme: dark;
}
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.9; }
.doc {
  max-width: 860px; margin-inline: auto;
  padding-block: 40px 96px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3, h4 { line-height: 1.5; text-wrap: balance; font-weight: 800; }
h1 { font-size: 2rem; margin: 0 0 8px; }
h2 { font-size: 1.55rem; margin: 64px 0 12px; padding-block-start: 20px; border-block-start: 2px solid var(--ink); }
h3 { font-size: 1.22rem; margin: 40px 0 8px; font-weight: 700; }
h4 { font-size: 1.05rem; margin: 26px 0 6px; font-weight: 700; color: var(--muted); }
h2 .num, h3 .num, h4 .num { color: var(--accent); margin-inline-end: 8px; font-variant-numeric: tabular-nums; }
p { margin: 0 0 14px; }
.lede { font-size: 1.08rem; color: var(--muted); max-width: 70ch; }
.meta bdi { white-space: nowrap; }
.meta { color: var(--muted); font-size: .9rem; margin-block-end: 28px; }
a { color: var(--accent); text-underline-offset: 3px; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, .ltr-code { font-family: var(--font-mono); font-size: .86em; color: var(--code); background: var(--panel); padding: 1px 6px; border-radius: 4px; direction: ltr; unicode-bidi: isolate; }
ul, ol { padding-inline-start: 1.6em; margin: 0 0 14px; }
li { margin-block-end: 4px; }
ol.fa { list-style-type: persian; }
nav.toc { background: var(--panel); border-radius: 8px; padding: 18px 22px; margin-block: 24px 8px; }
nav.toc h2 { margin: 0 0 8px; padding: 0; border: 0; font-size: 1.1rem; }
nav.toc ol { margin: 0; list-style: none; padding-inline-start: 0; }
nav.toc ol ol { padding-inline-start: 1.4em; font-size: .94rem; }
nav.toc li { margin: 2px 0; }
nav.toc a { color: var(--ink); text-decoration: none; }
nav.toc a:hover { color: var(--accent); text-decoration: underline; }
.eq { direction: ltr; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; margin: 14px 0 18px; padding: 10px 14px; background: var(--panel); border-radius: 6px; overflow-x: auto; }
.eq .tag { direction: rtl; color: var(--muted); font-size: .85rem; white-space: nowrap; }
.eq math { font-size: 1.12em; }
figure { margin: 22px 0 26px; }
figure .diagram { direction: ltr; overflow-x: auto; background: var(--panel); border-radius: 8px; padding: 14px; }
figure .diagram pre.mermaid { margin: 0; background: transparent; text-align: center; font-family: var(--font-body); }
figcaption { color: var(--muted); font-size: .9rem; margin-block-start: 8px; }
figcaption b { color: var(--ink); }
.table-wrap { overflow-x: auto; margin: 6px 0 24px; }
table { border-collapse: collapse; width: 100%; font-size: .93rem; font-variant-numeric: tabular-nums; }
caption { caption-side: top; text-align: start; color: var(--muted); font-size: .9rem; padding-block-end: 6px; }
caption b { color: var(--ink); }
th, td { border-block-end: 1px solid var(--rule); padding: 8px 10px; text-align: start; vertical-align: top; }
thead th { border-block-end: 2px solid var(--ink); font-weight: 700; white-space: nowrap; }
td.ltr, th.ltr { direction: ltr; text-align: left; }
.note { border-inline-start: 3px solid var(--accent); background: var(--accent-soft); padding: 10px 16px; border-radius: 0 6px 6px 0; margin: 16px 0 20px; }
.note p:last-child { margin: 0; }
.sentences { direction: ltr; text-align: left; font-family: var(--font-mono); font-size: .8rem; line-height: 1.6; color: var(--code); }
.grade { white-space: nowrap; font-weight: 700; }
@media (max-width: 520px) { h1 { font-size: 1.6rem; } h2 { font-size: 1.3rem; } body { font-size: 16px; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
html { scroll-behavior: smooth; }
</style>
